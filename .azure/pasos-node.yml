# Pasos comunes de los jobs que usan Node.js.

steps:
  # Debe coincidir con "engines" de package.json: .npmrc tiene engine-strict
  # y npm se niega a instalar con otra versión.
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
    displayName: Usar Node.js 22

  # Caché de descargas de npm, indexada por el package-lock.json: si las
  # dependencias no cambian, los cinco jobs no vuelven a bajarlas.
  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: Caché de npm

  # Instalación con las versiones exactas del package-lock.json.
  - script: npm ci
    displayName: Instalar dependencias (npm ci)
